name: Tyne iOS TestFlight

# Builds the shipped flavour (canary) as Tyne for iOS and uploads it to App Store Connect,
# where it appears in TestFlight once Apple has processed it.
#
# The signing material lives in the `tyne-testflight` environment, which only the `tyne`
# branch may use: an Apple Distribution certificate (TYNE_IOS_DIST_P12, base64, and its
# password), one App Store provisioning profile per bundle ID (TYNE_IOS_PROFILE_*, base64),
# and an App Store Connect API key (TYNE_ASC_KEY_P8, TYNE_ASC_KEY_ID, TYNE_ASC_ISSUER_ID)
# for the upload. The certificate and profiles expire on 2027-10-14.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version shown in TestFlight (CFBundleShortVersionString). Empty: pubspec.yaml's version."
        required: false
        default: ""

concurrency:
  group: fork-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 120
    environment: tyne-testflight
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_ID: chat.tyne.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Give the iOS project Tyne's identity
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        run: python3 tool/fork_ios_identity.py --team-id "$TEAM_ID"

      - name: Configure iOS store build tree
        run: dart tool/configure_build.dart --profile=ios-store

      - name: Set up Rust and native asset build hooks
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup target add aarch64-apple-ios
          flutter config --enable-native-assets

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Import the distribution certificate
        env:
          P12: ${{ secrets.TYNE_IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.TYNE_IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/tyne.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install the provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.TYNE_IOS_PROFILE_APP }}
          PROFILE_NOTIFICATION_SERVICE: ${{ secrets.TYNE_IOS_PROFILE_NOTIFICATION_SERVICE }}
          PROFILE_SHARE_EXTENSION: ${{ secrets.TYNE_IOS_PROFILE_SHARE_EXTENSION }}
          PROFILE_BROADCAST_EXTENSION: ${{ secrets.TYNE_IOS_PROFILE_BROADCAST_EXTENSION }}
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        shell: bash
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # target name, bundle ID, base64 profile
          while read -r target bundle variable; do
            profile="$RUNNER_TEMP/$target.mobileprovision"
            printf '%s' "${!variable}" | base64 --decode > "$profile"
            decoded="$(security cms -D -i "$profile")"
            uuid="$(plutil -extract UUID raw - <<< "$decoded")"
            name="$(plutil -extract Name raw - <<< "$decoded")"
            app_id="$(plutil -extract Entitlements.application-identifier raw - <<< "$decoded")"
            expires="$(plutil -extract ExpirationDate raw - <<< "$decoded")"
            if [ "$app_id" != "$TEAM_ID.$bundle" ]; then
              echo "::error::The profile for $target is for $app_id, not $TEAM_ID.$bundle"
              exit 1
            fi
            cp "$profile" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "$target: $name ($uuid), expires $expires"
            echo "PROFILE_NAME_$target=$name" >> "$GITHUB_ENV"
          done <<EOF
          Runner $BUNDLE_ID PROFILE_APP
          NotificationService $BUNDLE_ID.NotificationService PROFILE_NOTIFICATION_SERVICE
          ShareExtension $BUNDLE_ID.ShareExtension PROFILE_SHARE_EXTENSION
          BroadcastExtension $BUNDLE_ID.BroadcastExtension PROFILE_BROADCAST_EXTENSION
          EOF

      - name: Sign the canary release configuration with the distribution profiles
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require "xcodeproj"
          project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          signed = []
          project.targets.each do |target|
            profile = ENV["PROFILE_NAME_#{target.name}"]
            next if profile.nil? || profile.empty?
            config = target.build_configurations.find { |c| c.name == "Release-canary" }
            abort "#{target.name} has no Release-canary configuration" if config.nil?
            settings = config.build_settings
            settings["CODE_SIGN_STYLE"] = "Manual"
            settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
            settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            settings["PROVISIONING_PROFILE_SPECIFIER"] = profile
            signed << target.name
          end
          abort "signed #{signed.inspect}, expected four targets" unless signed.size == 4
          project.save
          puts "Manual signing for #{signed.join(', ')}"
          RUBY

      - name: Work out the version
        env:
          BUILD_NAME_INPUT: ${{ inputs.build_name }}
        run: |
          BUILD_NAME="$BUILD_NAME_INPUT"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          if ! [[ "$BUILD_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$BUILD_NAME' is not a version App Store Connect accepts (up to three numbers)"
            exit 1
          fi
          # Unique and rising across runs and re-runs of this workflow.
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "::notice::Tyne $BUILD_NAME ($BUILD_NUMBER)"

      - name: Build Flutter for iOS
        run: |
          flutter build ios --release --flavor canary --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=apns \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Archive
        run: |
          xcodebuild archive -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme canary \
            -configuration Release-canary \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tyne.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            FLUTTER_BUILD_NAME="$BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.TYNE_APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME_Runner</string>
              <key>$BUNDLE_ID.NotificationService</key><string>$PROFILE_NAME_NotificationService</string>
              <key>$BUNDLE_ID.ShareExtension</key><string>$PROFILE_NAME_ShareExtension</string>
              <key>$BUNDLE_ID.BroadcastExtension</key><string>$PROFILE_NAME_BroadcastExtension</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tyne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Check what was signed
        run: |
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa"
          unzip -q "$IPA"
          app="$(ls -d Payload/*.app)"
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            echo "== $bundle: $(plutil -extract CFBundleIdentifier raw "$bundle/Info.plist") $(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist") ($(plutil -extract CFBundleVersion raw "$bundle/Info.plist"))"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p -
          done
          aps="$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -extract aps-environment raw - || true)"
          if [ "$aps" != "production" ]; then
            echo "::error::The app is signed with aps-environment '$aps'; TestFlight builds need 'production' for push"
            exit 1
          fi

      - name: Upload to App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.TYNE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.TYNE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.TYNE_ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded Tyne $BUILD_NAME ($BUILD_NUMBER). It shows in TestFlight once Apple has processed it."

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles" "$RUNNER_TEMP"/*.mobileprovision
