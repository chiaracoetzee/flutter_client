# SPDX-License-Identifier: AGPL-3.0-or-later
name: Nightly Rebase & AI Conflict Resolver

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (rebase and run tests, but do NOT push to remote)'
        required: true
        default: false
        type: boolean
      force_test_agent:
        description: 'Run self-test on Gemini 3.8 Flash API connectivity'
        required: false
        default: false
        type: boolean
      verify_push_permissions:
        description: 'Test remote write & workflow push permissions on a scratch branch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  nightly-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout automation tools
        uses: actions/checkout@v4
        with:
          path: automation-tools

      - name: Cache rebase agent script
        run: |
          mkdir -p /tmp/rebase_tools
          cp automation-tools/tool/rebase/rebase_agent.py /tmp/rebase_tools/
          chmod +x /tmp/rebase_tools/rebase_agent.py
          rm -rf automation-tools

      - name: Set up Python for AI Resolver
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Antigravity SDK
        run: pip install google-antigravity

      - name: Verify Gemini Flash API Connectivity
        if: ${{ inputs.force_test_agent == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python /tmp/rebase_tools/rebase_agent.py --self-test
          echo "Resting 10s to ensure clean quota before rebase..."
          sleep 10

      - name: Checkout features/subprofiles-mobile
        uses: actions/checkout@v4
        with:
          ref: features/subprofiles-mobile
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity & Remotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fluxerapp/flutter_client.git || git remote set-url upstream https://github.com/fluxerapp/flutter_client.git
          git fetch upstream canary
          git fetch origin features/subprofiles-mobile

      - name: Check for upstream changes & submodule updates
        id: check_upstream
        run: |
          COMMITS_BEHIND=$(git rev-list HEAD..upstream/canary --count)
          echo "Commits behind upstream/canary: $COMMITS_BEHIND"
          echo "commits_behind=$COMMITS_BEHIND" >> "$GITHUB_OUTPUT"

          # Check if submodules have new commits on their tracking branches
          git submodule sync --recursive
          git submodule foreach 'git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"'
          git submodule foreach 'git fetch origin'

          SUBMODULES_AHEAD=0
          for sub in dart_sdk fluxer; do
            branch=$(git config -f .gitmodules submodule.$sub.branch || echo "main")
            remote_sha=$(git -C "$sub" rev-parse "origin/$branch" 2>/dev/null || true)
            local_sha=$(git -C "$sub" rev-parse HEAD 2>/dev/null || true)
            if [ -n "$remote_sha" ] && [ "$remote_sha" != "$local_sha" ]; then
              echo "Submodule $sub has update on $branch: $local_sha -> $remote_sha"
              SUBMODULES_AHEAD=1
            fi
          done

          if [ "$COMMITS_BEHIND" -eq 0 ] && [ "$SUBMODULES_AHEAD" -eq 0 ] && [ "${{ inputs.force_test_agent }}" != "true" ]; then
            echo "Branch is already up to date with upstream/canary and all submodules. Nothing to rebase."
            echo "skip_rebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_rebase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push safety snapshot tag
        if: steps.check_upstream.outputs.skip_rebase != 'true' && (github.event_name == 'schedule' || inputs.dry_run == false || inputs.dry_run == 'false')
        run: |
          BACKUP_TAG="backup/subprofiles-mobile-$(date +'%Y%m%d-%H%M%S')"
          echo "Creating safety tag $BACKUP_TAG..."
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
          echo "backup_tag=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Set up Flutter
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust (Native Markdown Parser)
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Enable native assets
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: flutter config --enable-native-assets

      - name: Install dependencies
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          flutter pub get
          (cd packages/fluxer_markdown_native && dart pub get)
          (cd dart_sdk && dart pub get)
          for pkg in packages/*/; do
            [ "$pkg" = "packages/fluxer_fcm/" ] && continue
            [ -f "${pkg}pubspec.yaml" ] || continue
            flutter pub get --directory "$pkg"
          done

      - name: Restore build_runner cache
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('pubspec.lock', 'lib/**', 'build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run code generation (pre-rebase)
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: dart run build_runner build

      - name: Run Baseline Pre-Rebase Test Gate
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Running baseline test verification on features/subprofiles-mobile before rebase..."
          (cd packages/fluxer_markdown_native && dart test)
          (cd dart_sdk && dart test test/serialization/model_roundtrip_test.dart)
          flutter test test/features/chat/services/composer_mention_controller_test.dart test/features/chat/presentation/widgets/messages/message_mention_test.dart
          echo "Running baseline static code analysis..."
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Attempt Git Rebase against upstream/canary
        id: attempt_rebase
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          set +e
          git rebase upstream/canary
          REBASE_EXIT=$?
          if [ $REBASE_EXIT -ne 0 ]; then
            echo "Conflicts detected during rebase."
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "Clean rebase! No conflicts encountered."
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage 1 - Gemini Flash Conflict Resolution
        if: steps.attempt_rebase.outputs.has_conflicts == 'true'
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Invoking Gemini 3.8 Flash Rebase Agent..."
          python /tmp/rebase_tools/rebase_agent.py

      - name: Update Submodules to Tracking Branches
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Updating submodules to latest tracked commits..."
          git submodule sync --recursive
          git submodule foreach 'git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"'
          git submodule update --init --remote
          if ! git diff --quiet dart_sdk fluxer; then
            echo "Committing updated submodule pointers..."
            git add dart_sdk fluxer
            git commit -m "chore(submodules): update submodules to latest tracked commits" || true
            (cd packages/fluxer_markdown_native && dart pub get)
            (cd dart_sdk && dart pub get)
            for pkg in packages/*/; do
              [ "$pkg" = "packages/fluxer_fcm/" ] && continue
              [ -f "${pkg}pubspec.yaml" ] || continue
              flutter pub get --directory "$pkg"
            done
          else
            echo "Submodules already up to date."
          fi

      - name: Run code generation (post-rebase)
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: dart run build_runner build

      - name: Run Post-Rebase Test Verification Gate
        id: test_gate
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Running post-rebase test verification..."
          (cd packages/fluxer_markdown_native && dart test)
          (cd dart_sdk && dart test test/serialization/model_roundtrip_test.dart)
          flutter test test/features/chat/services/composer_mention_controller_test.dart test/features/chat/presentation/widgets/messages/message_mention_test.dart
          echo "Running post-rebase static code analysis..."
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Push Rebased Branch
        if: steps.check_upstream.outputs.skip_rebase != 'true' && (github.event_name == 'schedule' || inputs.dry_run == false || inputs.dry_run == 'false')
        run: |
          git push --force-with-lease origin features/subprofiles-mobile
          echo "Successfully rebased and pushed features/subprofiles-mobile."

      - name: Stage 2 - Escalate to Human Developer on Failure
        if: (failure() || cancelled()) && steps.check_upstream.outputs.skip_rebase != 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git rebase --abort 2>/dev/null || true
          
          ESCALATION_CONTENT=""
          if [ -f /tmp/rebase_escalation_reason.md ]; then
            ESCALATION_CONTENT=$(cat /tmp/rebase_escalation_reason.md)
          else
            ESCALATION_CONTENT="The AI agent encountered conflicts, rate limits, or test failures that could not be resolved automatically."
          fi

          ISSUE_BODY=$(cat <<EOF
          Hey @chiaracoetzee! 👋

          The automated nightly rebase of \`features/subprofiles-mobile\` against \`upstream/canary\` requires human intervention.

          ### 🤖 AI Diagnosis & Reason for Escalation
          $ESCALATION_CONTENT

          ### Details
          - **Workflow Run**: [View GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Safety Backup Tag**: \`${{ env.backup_tag || 'None created' }}\`

          The rebase has been aborted to protect your branch. Your remote branch has **not** been modified.
          EOF
          )

          gh repo set-default "${{ github.repository }}" 2>/dev/null || true
          gh label create "needs-rebase" --repo "${{ github.repository }}" --color "d73a4a" --description "Rebase conflicts require human intervention" 2>/dev/null || true

          gh issue create             --repo "${{ github.repository }}"             --title "⚠️ Nightly Rebase Failed: Human Intervention Required ($(date +'%Y-%m-%d'))"             --body "$ISSUE_BODY"             --assignee chiaracoetzee             --label "needs-rebase" 2>/dev/null ||           gh issue create             --repo "${{ github.repository }}"             --title "⚠️ Nightly Rebase Failed: Human Intervention Required ($(date +'%Y-%m-%d'))"             --body "$ISSUE_BODY"             --assignee chiaracoetzee

      - name: Upload AI Agent Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-agent-logs
          path: |
            /tmp/rebase_transcript.md
            /tmp/rebase_escalation_reason.md
            /tmp/antigravity_data
            /tmp/rebase_tools
